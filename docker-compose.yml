version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: docextract-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - docextract-uploads:/app/uploads
      - docextract-db:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/docextract.db
      - UPLOAD_DIR=/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: docextract-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  docextract-uploads:
  docextract-db:
